    html { scroll-behavior: smooth; }
    /* évite tout défilement horizontal dû au filigrane géant des titres */
    body { overflow-x: clip; }
    :root {
      --font-display: 'Playfair Display';

    html { background-color: #FAF3E6; color-scheme: light; }

    .rule-honey { height: 2px; background: linear-gradient(90deg, transparent, #E78300, transparent); }
    ::selection { background: #E78300; color: #fff; }

    /* Scrollbar discrète — curseur orange posé sur un track crème (constant).
       Identique sur la page et la liste des points de vente. */
    html { scrollbar-width: thin; scrollbar-color: rgba(231,131,0,0.55) #FAF3E6; }
    .scroll-soft { scrollbar-width: thin; scrollbar-color: rgba(231,131,0,0.55) #FAF3E6; }
    html::-webkit-scrollbar,
    .scroll-soft::-webkit-scrollbar { width: 8px; height: 8px; }
    html::-webkit-scrollbar-track,
    .scroll-soft::-webkit-scrollbar-track { background: #FAF3E6; }
    html::-webkit-scrollbar-thumb,
    .scroll-soft::-webkit-scrollbar-thumb {
      background-color: rgba(231,131,0,0.5);
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    html::-webkit-scrollbar-thumb:hover,
    .scroll-soft::-webkit-scrollbar-thumb:hover { background-color: rgba(231,131,0,0.85); }

    /* Bouton panier flottant — animations */
    @keyframes fabBump {
      0% { transform: scale(1); }
      35% { transform: scale(1.22); }
      70% { transform: scale(0.94); }
      100% { transform: scale(1); }
    }
    .fab-bump { animation: fabBump .34s cubic-bezier(.34,1.56,.64,1); }
    @keyframes cartExpand {
      0% { opacity: 0; transform: translateY(18px) scale(.82); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cart-expand { animation: cartExpand .42s cubic-bezier(.34,1.7,.5,1); transform-origin: bottom right; }
    @keyframes backdropIn { from { opacity: 0; } to { opacity: 1; } }
    .backdrop-in { animation: backdropIn .25s ease; }
    /* Disparition du panneau — même animation que l'apparition, jouée à l'envers. */
    @keyframes cartCollapse {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(18px) scale(.82); }
    }
    .cart-collapse { animation: cartCollapse .34s cubic-bezier(.5,0,.66,-0.2) forwards; transform-origin: bottom right; }
    @keyframes backdropOut { from { opacity: 1; } to { opacity: 0; } }
    .backdrop-out { animation: backdropOut .3s ease forwards; }

    /* Scrollbar du panneau bon de commande — track brun (même fond que la pop-up). */
    .scroll-cart { scrollbar-width: thin; scrollbar-color: rgba(231,131,0,0.6) #2A1C0E; }
    .scroll-cart::-webkit-scrollbar { width: 8px; height: 8px; }
    /* Track raccourci verticalement pour ne pas mordre sur les coins arrondis (rounded-3xl ≈ 24px). */
    .scroll-cart::-webkit-scrollbar-track { background: #2A1C0E; border-radius: 9999px; margin: 24px 0; }
    .scroll-cart::-webkit-scrollbar-thumb {
      background-color: rgba(231,131,0,0.55);
      border-radius: 9999px;
      border: 2px solid transparent;
      background-clip: content-box;
    }
    .scroll-cart::-webkit-scrollbar-thumb:hover { background-color: rgba(231,131,0,0.9); }

    /* Stepper catalogue — morphing discret entre « + » seul et « − n + » */
    .stepper-collapse {
      max-width: 0; opacity: 0; transform: scale(.3);
      overflow: hidden; pointer-events: none;
      transition: max-width .3s cubic-bezier(.34,1.6,.6,1), opacity .22s ease,
                  transform .3s cubic-bezier(.34,1.6,.6,1), margin .3s ease;
    }
    .stepper-collapse.open {
      max-width: 1.75rem; opacity: 1; transform: scale(1);
      margin-right: .375rem; pointer-events: auto;
    }
    .stepper-num {
      display: inline-block; width: 0; opacity: 0; transform: scale(.5);
      overflow: hidden; text-align: center;
      transition: width .3s cubic-bezier(.34,1.6,.6,1), opacity .22s ease,
                  transform .3s cubic-bezier(.34,1.6,.6,1), margin .3s ease;
    }
    .stepper-num.open {
      width: 1.25rem; opacity: 1; transform: scale(1); margin-right: .375rem;
    }

    /* Message « merci » — animations d'apparition (3 variantes) */
    @keyframes merciCheckPop {
      0% { opacity: 0; transform: scale(0) rotate(-25deg); }
      55% { opacity: 1; transform: scale(1.18) rotate(8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes merciRise {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes merciConfetti {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.2) rotate(0); }
      14% { opacity: 1; }
      100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(var(--rot)); }
    }
    @keyframes merciHalo {
      0% { opacity: .5; transform: translate(-50%, -50%) scale(.5); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(3); }
    }
    @keyframes merciShine {
      0% { transform: translateX(-130%) skewX(-20deg); }
      100% { transform: translateX(240%) skewX(-20deg); }
    }
    .merci-check { animation: merciCheckPop .6s cubic-bezier(.34,1.7,.5,1) both; }
    .merci-item { animation: merciRise .55s cubic-bezier(.16,.84,.44,1) both; }
    .merci-confetti { position: absolute; left: 0; top: 0; display: block;
      animation: merciConfetti 1s cubic-bezier(.2,.7,.3,1) both; }
    .merci-halo { position: absolute; left: 50%; top: 50%; width: 3.5rem; height: 3.5rem;
      border-radius: 9999px; border: 2px solid rgba(231,131,0,.55);
      animation: merciHalo 1.2s ease-out both; }
    .merci-shine { position: absolute; left: 50%; top: 50%; width: 3.5rem; height: 3.5rem;
      transform: translate(-50%, -50%); border-radius: 9999px; overflow: hidden;
      pointer-events: none; z-index: 20; }
    .merci-shine::before { content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), transparent);
      animation: merciShine 1s ease-in-out .35s both; }
    /* La cascade décale davantage les éléments pour un effet échelonné marqué. */
    .merci-mode-cascade .merci-item { animation-duration: .65s; }
    @media (prefers-reduced-motion: reduce) {
      .merci-check, .merci-item, .merci-confetti, .merci-halo, .merci-shine::before {

    }

    /* Carte des points de vente — tons chauds, cohérence miel */
    #carte-pdv { background: #f3ead4; }

    .pin-miellerie { background: #2A1C0E; width: 30px; height: 30px; }
  </style>

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {

    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}

}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

// Pastille de certification BIO — minimaliste : une ligne, vert bio marqué,

// Révèle ses enfants au scroll
function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setShown(true); io.disconnect(); } },
      { threshold: 0.12 }
    );
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div
      ref={ref}
      className={className}
      style={{
        opacity: shown ? 1 : 0,
        transform: shown ? "none" : "translateY(24px)",
        transition: `opacity .8s ease ${delay}ms, transform .8s cubic-bezier(.16,.84,.44,1) ${delay}ms`,
      }}
    >
      {children}
    </div>
  );
}

const FORMSPREE_ID = "VOTRE_FORM_ID";

function prixToNumber(prix) {
  return parseFloat(prix.replace("€", "").replace(",", ".").trim()) || 0;
}

function trouveFormat(key) {
  const [mielId, poids] = key.split("__");
  const miel = window.MIELS.find((m) => m.id === mielId);
  const format = miel ? miel.formats.find((f) => f.poids === poids) : null;
  return { miel, format };
}

function panierTotaux(selection) {
  const lignes = Object.entries(selection).filter(([, q]) => q > 0);
  const totalArticles = lignes.reduce((s, [, q]) => s + q, 0);
  const totalPrix = lignes.reduce((s, [key, q]) => {
    const { format } = trouveFormat(key);
    return s + (format ? prixToNumber(format.prix) * q : 0);
  }, 0);
  return { lignes, totalArticles, totalPrix };
}

  const ang = (i / 18) * Math.PI * 2 + (i % 2 ? 0.2 : -0.14);
  const dist = 66 + (i % 5) * 18;
  return {
    dx: Math.round(Math.cos(ang) * dist),
    dy: Math.round(Math.sin(ang) * dist),
    rot: (i % 2 ? 1 : -1) * (180 + (i % 4) * 90),
    color: MERCI_PALETTE[i % MERCI_PALETTE.length],
    delay: (i % 6) * 24,
    size: 6 + (i % 3) * 2,
    round: i % 3 === 0,
  };
});

// CartFab — bouton panier flottant (CTA) + panneau bon de commande flottant.
// Visible uniquement le temps de la section des miels (catalogue) : apparaît et
// disparaît avec la même animation zoom-bounce. Pulse à chaque ajout/retrait.
const { useState: useStateF, useEffect: useEffectF, useRef: useRefF } = React;

function CartIcon({ className = "" }) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      <circle cx="9" cy="20" r="1.5"></circle>
      <circle cx="18" cy="20" r="1.5"></circle>
      <path d="M2.5 3.5h2.2l2.1 11.4a1.6 1.6 0 0 0 1.6 1.3h8.2a1.6 1.6 0 0 0 1.6-1.3L20 7.5H5.4"></path>
    </svg>
  );
}

function CartFab(props) {
  const { selection, cartOpen, setCartOpen } = props;
  const { totalArticles } = window.panierTotaux(selection);

  const [visible, setVisible] = useStateF(false);
  const [panelRender, setPanelRender] = useStateF(false); // monte le panneau (le temps de l'anim de sortie)
  const [panelClosing, setPanelClosing] = useStateF(false);
  const fabRef = useRefF(null);
  const prevCount = useRefF(0);

  // Visibilité : uniquement tant que la section des miels occupe l'écran.
  useEffectF(() => {
    const onScroll = () => {
      const cat = document.getElementById("catalogue");
      if (!cat) return;
      const vh = window.innerHeight;
      const r = cat.getBoundingClientRect();
      setVisible(r.top < vh * 0.6 && r.bottom > vh * 0.4);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);

  // Pulse zoom-bounce à chaque changement de quantité.
  useEffectF(() => {
    if (totalArticles !== prevCount.current) {
      prevCount.current = totalArticles;
      const el = fabRef.current;
      if (el) {
        el.classList.remove("fab-bump");
        void el.offsetWidth; // reflow pour rejouer l'animation
        el.classList.add("fab-bump");
      }
    }
  }, [totalArticles]);

  // Referme le panneau flottant dès que le bouton n'est plus visible.
  useEffectF(() => {
    if (!visible && cartOpen) setCartOpen(false);
  }, [visible]);

  // Monte/démonte le panneau avec une animation d'entrée ET de sortie (identiques).
  useEffectF(() => {
    if (cartOpen) {
      setPanelRender(true);
      setPanelClosing(false);
    } else if (panelRender) {
      setPanelClosing(true);
      const tm = setTimeout(() => { setPanelRender(false); setPanelClosing(false); }, 320);
      return () => clearTimeout(tm);
    }
  }, [cartOpen]);

  // Apparition ET disparition du bouton : même animation, bien plus dynamique
  // (ressort marqué qui dépasse + rotation ample + petit arc vertical).
  const wrapStyle = {
    transition: "transform .58s cubic-bezier(.18,1.9,.34,1), opacity .26s ease",
    transform: visible
      ? "translateY(0) scale(1) rotate(0deg)"
      : "translateY(40px) scale(0) rotate(-160deg)",
    opacity: visible ? 1 : 0,
    pointerEvents: visible ? "auto" : "none",
  };

  return (
    <React.Fragment>
      {/* Bouton flottant */}
      <div className="fixed bottom-5 right-5 z-[60] md:bottom-7 md:right-7" style={wrapStyle}>
        <button
          ref={fabRef}
          onClick={() => setCartOpen(true)}
          aria-label="Voir mon bon de commande"
          className="relative grid h-14 w-14 place-items-center rounded-full bg-honey text-white shadow-jar ring-1 ring-black/5 transition-colors hover:bg-honey-deep md:h-16 md:w-16"
        >
          <CartIcon className="h-6 w-6 md:h-7 md:w-7" />
          {totalArticles > 0 ? (
            <span className="absolute -right-1 -top-1 grid h-6 w-6 place-items-center rounded-full bg-cream font-body text-xs font-extrabold text-ink ring-2 ring-honey">
              {totalArticles}
            </span>
          ) : null}
        </button>
      </div>

      {/* Panneau bon de commande flottant */}
      {panelRender ? (
        <div className="fixed inset-0 z-[70]" role="dialog" aria-modal="true">
          <div
            className={(panelClosing ? "backdrop-out" : "backdrop-in") + " absolute inset-0 bg-ink/55 backdrop-blur-sm"}
            onClick={() => setCartOpen(false)}
          ></div>
          <div className={(panelClosing ? "cart-collapse" : "cart-expand") + " scroll-cart absolute inset-x-3 bottom-3 max-h-[86vh] overflow-y-auto rounded-3xl bg-ink p-6 text-cream shadow-jar ring-1 ring-cream/10 sm:inset-x-auto sm:bottom-6 sm:right-6 sm:w-[440px] md:bottom-7 md:right-7"}>
            <div className="mb-5 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <span className="grid h-9 w-9 place-items-center rounded-full bg-honey/15 text-honey">
                  <CartIcon className="h-5 w-5" />
                </span>
                <h3 className="font-display text-xl text-cream">Votre bon de commande</h3>
              </div>
              <button
                onClick={() => setCartOpen(false)}
                aria-label="Fermer"
                className="grid h-9 w-9 place-items-center rounded-full text-cream/60 transition-colors hover:bg-cream/10 hover:text-cream"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" className="h-5 w-5"><path d="M6 6l12 12M18 6L6 18"></path></svg>
              </button>
            </div>
            <OrderForm {...props} stack={true} />
          </div>
        </div>
      ) : null}
    </React.Fragment>
  );
}

// Points de vente — carte interactive (Leaflet) synchronisée avec la liste.
const { useState: useStatePV, useEffect: useEffectPV, useRef: useRefPV } = React;

function PointsDeVente() {
  const points = window.POINTS_DE_VENTE;
  const miellerie = window.MIELLERIE;

  const mapEl = useRefPV(null);
  const mapRef = useRefPV(null);
  const markersRef = useRefPV({});
  const [selected, setSelected] = useStatePV(null);

  // Initialisation de la carte — on attend que le conteneur ait une hauteur
  // (le CSS de Tailwind via CDN est injecté de façon asynchrone).
  useEffectPV(() => {
    if (!window.L) return;
    let tries = 0;
    const timer = setInterval(() => {
      const el = mapEl.current;
      tries += 1;
      if (mapRef.current || tries > 100) { clearInterval(timer); return; }
      if (el && el.clientHeight >= 50) {
        clearInterval(timer);
        initCarte();
      }
    }, 60);
    return () => clearInterval(timer);
  }, []);

  function initCarte() {
    if (mapRef.current || !mapEl.current) return;
    const L = window.L;

    const map = L.map(mapEl.current, {
      scrollWheelZoom: false,
      attributionControl: true,
    });
    mapRef.current = map;
    window.__pvmap = map;

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO',
    }).addTo(map);

    const mkIcon = (cls) =>
      L.divIcon({ className: "", html: `<div class="pin-miel ${cls}"></div>`, iconSize: [26, 26], iconAnchor: [13, 26], popupAnchor: [0, -26] });

    // Marqueur de la miellerie
    L.marker([miellerie.lat, miellerie.lng], { icon: mkIcon("pin-miellerie") })
      .addTo(map)
      .bindPopup(`<strong>${miellerie.nom}</strong><br><span style="color:#5C4A35">${miellerie.ville}</span>`);

    // Marqueurs des points de vente
    points.forEach((p) => {
      const m = L.marker([p.lat, p.lng], { icon: mkIcon("") })
        .addTo(map)
        .bindPopup(
          `<strong>${p.nom}</strong><br><span style="color:#5C4A35">${p.ville}</span>` +
            (p.url ? `<br><a href="${p.url}" target="_blank" rel="noopener" style="color:#C96A00;font-weight:600">Voir le magasin →</a>` : "")
        );
      m.on("click", () => setSelected(p.id));
      markersRef.current[p.id] = m;
    });

    // Vue par défaut : cœur du Vaucluse (les magasins plus au sud — Marseille,
    // Aix, Istres — restent accessibles en cliquant dans la liste).
    map.setView([43.98, 5.10], 10);
    map.invalidateSize();
    const ro = new ResizeObserver(() => map.invalidateSize());
    ro.observe(mapEl.current);
  }

  // Met en évidence le marqueur sélectionné
  useEffectPV(() => {
    Object.entries(markersRef.current).forEach(([id, m]) => {
      const el = m.getElement && m.getElement();
      if (el) {
        const pin = el.querySelector(".pin-miel");
        if (pin) pin.classList.toggle("is-active", id === selected);
      }
    });
  }, [selected]);

  function focusPoint(p) {
    setSelected(p.id);
    const map = mapRef.current;
    const m = markersRef.current[p.id];
    if (map && m) {
      map.flyTo([p.lat, p.lng], 13, { duration: 0.8 });
      m.openPopup();
    }
  }

  return (
    <section id="points-de-vente" className="scroll-mt-20 bg-paper">
      <div className="mx-auto max-w-7xl px-5 py-16 md:px-10 md:py-24">
        <div className="mb-10 max-w-2xl">
          <SectionLabel>En boutique</SectionLabel>
          <h2 className="mt-4 font-display text-3xl leading-tight text-ink md:text-5xl">
            Aussi près de chez vous
          </h2>
          <p className="mt-4 font-body text-base leading-relaxed text-ink-soft">
            Vous préférez acheter en magasin ? Retrouvez mes miels dans une sélection de Biocoop
            et d'épiceries bio de Provence et des Bouches-du-Rhône. Cliquez sur un magasin pour
            le situer sur la carte.
          </p>
        </div>

        <div className="isolate overflow-hidden rounded-3xl bg-cream shadow-soft ring-1 ring-ink/[0.06]">
          <div className="grid lg:grid-cols-[1.4fr_1fr]">
            {/* Carte */}
            <div className="relative order-1 h-[340px] sm:h-[420px] lg:h-[600px]">
              <div id="carte-pdv" ref={mapEl} className="absolute inset-0 h-full w-full"></div>
              {/* Légende */}
              <div className="pointer-events-none absolute bottom-3 left-3 z-[500] flex flex-col gap-1.5 rounded-xl bg-paper/90 px-3 py-2 backdrop-blur">
                <span className="flex items-center gap-2 font-body text-[11px] font-semibold text-ink-soft">
                  <span className="inline-block h-3 w-3 rounded-full bg-honey"></span> Point de vente
                </span>
                <span className="flex items-center gap-2 font-body text-[11px] font-semibold text-ink-soft">
                  <span className="inline-block h-3 w-3 rounded-full bg-ink"></span> La miellerie
                </span>
              </div>
            </div>

            {/* Liste */}
            <div className="order-2 flex flex-col border-t border-ink/[0.08] lg:border-l lg:border-t-0">
              <div className="flex items-center justify-between px-5 pt-5 pb-3 md:px-6">
                <span className="font-body text-lg font-semibold text-ink">{points.length} points de vente</span>
              </div>
              <ul className="scroll-soft flex-1 overflow-y-auto px-3 pb-4 lg:max-h-[535px] md:px-4">
                {points.map((p) => {
                  const actif = selected === p.id;
                  return (

                        <span className="min-w-0">

                          <span className="block font-body text-xs text-ink-soft">{p.ville}</span>
                        </span>
                      </button>
                    </li>
                  );
                })}
              </ul>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

    setSelection((prev) => ({ ...prev, [key]: (prev[key] || 0) + 1 }));
  }

  function onRemove(miel, poids) {
    const key = miel.id + "__" + poids;
    setSelection((prev) => {
      const next = { ...prev };
      const q = (next[key] || 0) - 1;
      if (q <= 0) delete next[key];
      else next[key] = q;
      return next;
    });
  }

  function submitOrder(e) {
    e.preventDefault();
    setErreur("");
    const lignes = Object.entries(selection).filter(([, q]) => q > 0);
    if (lignes.length === 0) { setErreur("Sélectionnez au moins un miel dans le catalogue."); return; }
    if (!client.nom.trim() || !client.email.trim()) { setErreur("Merci d'indiquer au minimum votre nom et votre e-mail."); return; }
    // En production : POST vers https://formspree.io/f/FORMSPREE_ID
    setEnvoye(true);
  }

  const orderProps = { selection, setSelection, client, setClient, envoye, setEnvoye, erreur, onSubmit: submitOrder };

  return (
    <window.TweakCtx.Provider value={t}>
      <Header />
      <main>
        <Hero />
        {t.showValeurs && <Valeurs />}
        <Catalogue onAdd={onAdd} onRemove={onRemove} selection={selection} />
        <BonDeCommande {...orderProps} />
        <APropos />
        <PointsDeVente />
      </main>
      <Footer />
      <CartFab {...orderProps} cartOpen={cartOpen} setCartOpen={setCartOpen} />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Page" />
        <TweakToggle
          label="Bandeau repères (01–04)"
          value={t.showValeurs}
          onChange={(v) => setTweak("showValeurs", v)}
        />

        <TweakSection label="Message de confirmation" />
        <TweakButton
          label={envoye ? "Réinitialiser le formulaire" : "Aperçu du message merci"}
          secondary={envoye}
          onClick={() => setEnvoye(!envoye)}
        />
      </TweaksPanel>
    </window.TweakCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

  </script>
</body>
</html>
